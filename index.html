es:{title:"Second conditional: si pasara algo, haría esto",sw:"Switch to English",tabE:"Explicación",tabP:"Práctica",h1:"Second conditional",
lead:"Se usa para hablar de cosas que <b>no son reales</b> o son muy poco probables, y de lo que pasaría si lo fueran. En español: “Si tuviera…, haría…”.",hb:"Otro ejemplo",
how:`<h2>Cómo se arma</h2><div class="formula"><div class="row"><span class="if">If</span><span class="if">+ past simple</span><span>,</span><span class="wd">would</span><span class="wd">+ verbo base</span></div><small>Se puede invertir el orden. Si empezás con “if”, va coma. Si empezás con “would”, no.</small></div><p><span class="if">If I had a car</span>, <span class="wd">I would drive</span> to work.</p><p><span class="wd">I would drive</span> to work <span class="if">if I had a car</span>.</p><p>Aunque la parte del “if” está en pasado, <b>no habla del pasado</b>: habla del presente o del futuro imaginario.</p>`,
uses:`<h2>Cuándo usarlo</h2><ul class="uses"><li><b>Situaciones imaginarias:</b> <i>If I were a bird, I would fly over the city.</i> (Si fuera un pájaro…)</li><li><b>Cosas improbables:</b> <i>If I won the lottery, I would quit my job.</i> (Si ganara la lotería…)</li><li><b>Consejos:</b> <i>If I were you, I would talk to her.</i> (Yo que vos, hablaría con ella.)</li></ul>`,
were:`<h2>Con “be”: siempre “were”</h2><p>En este condicional, con <b>todas</b> las personas se usa <span class="if">were</span>: <i>If I were, if he were, if she were, if it were</i>. En la conversación informal también se escucha “was”, pero “were” es la forma correcta y la que piden en los exámenes.</p>`,
mod:`<h2>Variantes con could y might</h2><div class="tbl"><table><tr><th>Verbo</th><th>Significado</th><th>Ejemplo</th></tr><tr><td><span class="wd">would</span></td><td>haría (seguro)</td><td>If I had time, I would learn guitar.</td></tr><tr><td><span class="wd">could</span></td><td>podría</td><td>If I had time, I could learn guitar.</td></tr><tr><td><span class="wd">might</span></td><td>quizás haría</td><td>If I had time, I might learn guitar.</td></tr></table></div>`,
err:`<h2>Errores comunes</h2><details><summary>Poner “would” después de “if”</summary><p><span class="bad">✗</span> If I would have money, I would travel.</p><p><span class="good">✓</span> If I <b>had</b> money, I would travel.</p><p>El “would” va solo en la parte del resultado, nunca en la del “if”.</p></details><details><summary>Usar el presente en la parte del “if”</summary><p><span class="bad">✗</span> If I know the answer, I would tell you.</p><p><span class="good">✓</span> If I <b>knew</b> the answer, I would tell you.</p><p>Con presente + will tenés el first conditional, que es para cosas posibles y reales.</p></details><details><summary>Confundirlo con el first conditional</summary><p><b>First:</b> If it rains, I <i>will stay</i> home. (puede pasar)</p><p><b>Second:</b> If it rained, I <i>would stay</i> home. (es hipotético o improbable)</p></details><details><summary>Contracciones</summary><p>En la conversación: <i>I’d</i> = I would, <i>wouldn’t</i> = would not. Ejemplo: If I were rich, I’d buy an island.</p></details>`,

how:`<h2>How to build it</h2><div class="formula"><div class="row"><span class="if">If</span><span class="if">+ past simple</span><span>,</span><span class="wd">would</span><span class="wd">+ base verb</span></div><small>You can swap the order. With “if” first, use a comma. With “would” first, no comma.</small></div><p><span class="if">If I had a car</span>, <span class="wd">I would drive</span> to work.</p><p><span class="wd">I would drive</span> to work <span class="if">if I had a car</span>.</p><p>Even though the “if” part is in the past tense, it is <b>not about the past</b>: it describes an imaginary present or future.</p>`,
uses:`<h2>When to use it</h2><ul class="uses"><li><b>Imaginary situations:</b> <i>If I were a bird, I would fly over the city.</i></li><li><b>Unlikely things:</b> <i>If I won the lottery, I would quit my job.</i></li><li><b>Advice:</b> <i>If I were you, I would talk to her.</i></li></ul>`,
were:`<h2>With “be”: always “were”</h2><p>In the second conditional, use <span class="if">were</span> with <b>every</b> person: <i>If I were, if he were, if she were, if it were</i>. In casual speech you will also hear “was”, but “were” is the standard form and the one exams expect.</p>`,
mod:`<h2>Variants with could and might</h2><div class="tbl"><table><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr><tr><td><span class="wd">would</span></td><td>would for sure</td><td>If I had time, I would learn guitar.</td></tr><tr><td><span class="wd">could</span></td><td>would be able to</td><td>If I had time, I could learn guitar.</td></tr><tr><td><span class="wd">might</span></td><td>maybe would</td><td>If I had time, I might learn guitar.</td></tr></table></div>`,
err:`<h2>Common mistakes</h2><details><summary>Putting “would” after “if”</summary><p><span class="bad">✗</span> If I would have money, I would travel.</p><p><span class="good">✓</span> If I <b>had</b> money, I would travel.</p><p>“Would” goes only in the result part, never in the “if” part.</p></details><details><summary>Using the present in the “if” part</summary><p><span class="bad">✗</span> If I know the answer, I would tell you.</p><p><span class="good">✓</span> If I <b>knew</b> the answer, I would tell you.</p><p>Present + will is the first conditional, which is for possible, real situations.</p></details><details><summary>Mixing it up with the first conditional</summary><p><b>First:</b> If it rains, I <i>will stay</i> home. (it might happen)</p><p><b>Second:</b> If it rained, I <i>would stay</i> home. (hypothetical or unlikely)</p></details><details><summary>Contractions</summary><p>In conversation: <i>I’d</i> = I would, <i>wouldn’t</i> = would not. Example: If I were rich, I’d buy an island.</p></details>`,

    box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
      if(done)return;done=true;
      var ok=b.textContent===c.o[0];if(ok)s++;
      box.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.textContent===c.o[0])x.classList.add("ok");else if(x===b)x.classList.add("no")});
      box.querySelector(".fbx").innerHTML='<div class="fb"><b>'+(ok?t("ok"):t("no"))+'</b>'+L(c.e)+'</div><button class="btn" type="button" id="'+id+'n">'+(i===items.length-1?t("see"):t("nxt"))+'</button>';
      document.getElementById(id+"n").onclick=function(){i++;r()};
    }});
  }
  r();
}

function fill(){
  var fb=document.getElementById("fill");
  function fr(){
    var h='';
    F.forEach(function(f,k){
      var m=f.t.match(/^(.*)\(([^)]+)\)(.*)$/);
      h+='<p class="fi">'+m[1]+'<input type="text" id="f'+k+'" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="'+(k+1)+'"> <span class="hint">('+m[2]+')</span>'+m[3]+'<span class="fr" id="r'+k+'"></span></p>';
    });
    h+='<button class="btn" type="button" id="fc">'+t("check")+'</button> <button class="btn alt" type="button" id="fx">'+t("clear")+'</button><div class="fb" id="fs" hidden></div>';
    fb.innerHTML=h;
    document.getElementById("fc").onclick=function(){
      var n=0;
      F.forEach(function(f,k){
        var inp=document.getElementById("f"+k),r=document.getElementById("r"+k);
        var v=inp.value.trim().toLowerCase().replace(/\u2019/g,"'").replace(/\s+/g," ");
        var ok=v===f.a;if(ok)n++;
        inp.className=ok?"ok":"no";
        r.textContent=ok?t("fok"):t("ans")+f.a.replace("'","\u2019");
      });
      var s=document.getElementById("fs");s.hidden=false;
      s.innerHTML='<b>'+n+' '+t("of")+' '+F.length+t("good")+'</b> '+(n===F.length?t("perf"):t("rev"));
    };
    document.getElementById("fx").onclick=fr;
  }
  fr();
}

function order(){
  var ob=document.getElementById("order"),ui=0,us=0;
  function ur(){
    if(ui>=U.length){
      ob.innerHTML='<div class="qmeta">'+t("res")+'</div><div class="score">'+us+' / '+U.length+'</div><button class="btn alt" type="button" id="ur">'+t("again")+'</button>';
      document.getElementById("ur").onclick=function(){ui=0;us=0;ur()};return;
    }
    var tgt=U[ui].t,w=tgt.split(" "),pool=sh(w),ans=[],locked=false;
    if(pool.join(" ")===tgt)pool=sh(w);
    function draw(){
      var h='<div class="qmeta"><span>'+(ui+1)+' '+t("of")+' '+U.length+'</span></div><p class="q">'+(lang==="es"?U[ui].es:t("op"))+'</p><div class="ans">';
      h+=ans.length?ans.map(function(k){return '<button class="chip" type="button" data-a="'+k+'">'+pool[k]+'</button>'}).join(""):'<span class="hint">'+t("tap")+'</span>';
      h+='</div><div class="pool">'+pool.map(function(x,k){return ans.indexOf(k)<0?'<button class="chip" type="button" data-p="'+k+'">'+x+'</button>':''}).join("")+'</div>';
      h+='<button class="btn" type="button" id="oc">'+t("check")+'</button><div id="ofb"></div>';
      ob.innerHTML=h;
      if(locked)return;
      ob.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){ans.push(+b.dataset.p);draw()}});
      ob.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){ans.splice(ans.indexOf(+b.dataset.a),1);draw()}});
      document.getElementById("oc").onclick=function(){
        var ok=ans.map(function(k){return pool[k]}).join(" ")===tgt;
        if(ok)us++;locked=true;draw();
        document.getElementById("oc").remove();
        document.getElementById("ofb").innerHTML='<div class="fb"><b>'+(ok?t("ok"):t("no"))+'</b>'+(ok?"":t("was")+tgt)+'</div><button class="btn" type="button" id="on">'+(ui===U.length-1?t("see"):t("nxt"))+'</button>';
        document.getElementById("on").onclick=function(){ui++;ur()};
      };
    }
    draw();
  }
  ur();
}

var ve=document.getElementById("v-exp"),vp=document.getElementById("v-pra");
function route(){
  var p=location.hash==="#practica";
  ve.hidden=p;vp.hidden=!p;
  document.querySelectorAll("a.tab").forEach(function(a){if((a.getAttribute("href")==="#practica")===p)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
function apply(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=t(e.dataset.i)});
  var b=document.getElementById("lang");b.textContent=lang==="es"?"EN":"ES";b.setAttribute("aria-label",t("sw"));
  hero();mc("quiz",Q);fill();order();mc("trans",TR[lang]);
}
document.getElementById("lang").addEventListener("click",function(){
  lang=lang==="es"?"en":"es";
  try{localStorage.setItem("lang",lang)}catch(e){}
  apply();
});
window.addEventListener("hashchange",route);
apply();route();
})();
</script>
